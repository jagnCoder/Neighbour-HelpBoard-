<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neighborhood Helpboard</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #messages { scrollbar-width: thin; scrollbar-color: #475569 #0f172a; }
    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .textarea-auto { resize: none; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-sky-500/30 overflow-x-hidden">

  <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden" onclick="hideSidebar()"></div>

  <div class="flex lg:flex-row flex-col min-h-screen">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 border-r border-white/10 bg-slate-950/80 backdrop-blur-md transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col lg:relative lg:translate-x-0 lg:static lg:z-auto">
      <div class="flex items-center gap-3 px-6 py-5">
        <div class="w-8 h-8 rounded-xl bg-sky-500/20 flex items-center justify-center text-sky-400 font-bold">N</div>
        <span class="font-semibold text-white tracking-tight">Neighborhood</span>
      </div>
      <nav class="flex-1 px-4 py-4 space-y-1">
        <button class="w-full flex items-center gap-3 px-3 py-2 rounded-xl bg-white/10 text-white" aria-current="true">
          <span class="w-5 text-center">💬</span> <span class="font-medium">Feed</span>
        </button>
        <button class="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition" onclick="scrollToInput()">
          <span class="w-5 text-center">✏️</span> Compose
        </button>
      </nav>
      <div class="border-t border-white/10 mt-auto px-4 py-4 lg:mt-0 lg:border-t-0 lg:px-2 lg:py-0">
        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">System</h3>
        <div class="text-sm text-slate-400 space-y-2">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs">UI endpoint</span>
            <span class="rounded-full bg-slate-800 px-2 py-0.5 uppercase tracking-[0.1em] text-[10px] text-slate-400">/messages</span>
          </div>
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs">Health check</span>
            <span class="rounded-full bg-slate-800 px-2 py-0.5 uppercase tracking-[0.1em] text-[10px] text-slate-400">/health</span>
          </div>
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs">Backend TCP</span>
            <span class="rounded-full bg-slate-800 px-2 py-0.5 uppercase tracking-[0.1em] text-[10px] text-slate-400">127.0.0.1:7000</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-h-0 relative">
      <header class="sticky top-0 z-20 border-b border-white/10 bg-slate-950/80 backdrop-blur-md">
        <div class="flex items-center justify-between px-4 py-3 sm:px-6">
          <button class="flex items-center justify-center w-9 h-9 rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition lg:hidden" aria-label="Open menu" onclick="toggleSidebar()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          <span class="font-semibold text-white tracking-tight hidden sm:block">Neighborhood Helpboard</span>
          <div class="flex items-center gap-2">
            <button id="refreshButton" class="flex items-center justify-center w-9 h-9 rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition" aria-label="Refresh messages">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m14.458 2H4m0 0l.582-3.414m0 0L4 4m0 0L4 4m0 0h.582M16 4v5h.582m14.458 2H16m0 0l.582-3.414m0 0L16 4m0 0L16 4m0 0h.582M16 4v5h.582"></path></svg>
            </button>
          </div>
        </div>
      </header>

      <main id="chatScroll" class="flex-1 min-h-0 overflow-y-auto relative">
        <div id="messages" class="flex flex-col gap-3 p-4 sm:p-6 pb-4"></div>
      </main>

      <div class="sticky bottom-0 z-20 w-full">
        <div class="border-t border-white/10 bg-slate-950/80 backdrop-blur-md px-4 sm:px-6 pb-4 pt-3">
          <form id="postForm" class="max-w-4xl mx-auto space-y-3">
            <div class="flex flex-col sm:flex-row gap-2 items-end">
              <div class="relative flex-1 min-w-0">
                <input id="username" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-slate-100 outline-none transition focus:border-sky-500 focus:ring-1 focus:ring-sky-500" placeholder="Your name" />
              </div>
              <select id="type" class="shrink-0 rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 text-sm text-slate-100 outline-none transition focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                <option value="message">Message</option>
                <option value="alert">Alert</option>
                <option value="offer">Offer</option>
                <option value="info">Info</option>
              </select>
              <div class="relative flex-1 min-w-0">
                <textarea id="message" rows="1" class="textarea-auto w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-slate-100 outline-none transition focus:border-sky-500 focus:ring-1 focus:ring-sky-500" placeholder="Say something to the neighborhood..."></textarea>
              </div>
              <button id="submitButton" type="submit" class="shrink-0 rounded-full bg-sky-500 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-sky-500/25 transition hover:bg-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-400/70 active:scale-95">Post</button>
            </div>
            <p id="status" class="text-xs text-slate-400"></p>
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs text-slate-500">Sort by time</span>
              <div class="flex items-center gap-2 shrink-0">
                <input id="filterType" class="hidden w-28 rounded-lg border border-white/10 bg-white/5 px-2.5 py-1.5 text-slate-100 text-xs outline-none focus:border-sky-500" placeholder="type..." />
                <button id="filterToggle" class="px-2.5 py-1.5 rounded-lg border border-white/10 bg-white/5 text-xs text-slate-300 hover:bg-white/10 hover:text-white transition">All types</button>
                <button id="sortButton" class="px-2.5 py-1.5 rounded-lg bg-white/10 text-xs font-medium text-slate-300 hover:bg-white/20 transition">Newest ▼</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const scrollEl = document.getElementById('chatScroll');
    const statusEl = document.getElementById('status');
    const submitButton = document.getElementById('submitButton');
    const sortButton = document.getElementById('sortButton');
    const filterToggle = document.getElementById('filterToggle');
    const filterInput = document.getElementById('filterType');
    const endpoint = '/messages';
    let sortOrder = 'desc';
    let filterVisible = false;

    const typeColors = {
      message: 'bg-sky-500/20 border border-sky-500/30 text-sky-400',
      alert: 'bg-rose-500/20 border border-rose-500/30 text-rose-400',
      offer: 'bg-emerald-500/20 border border-emerald-500/30 text-emerald-400',
      info: 'bg-amber-500/20 border border-amber-500/30 text-amber-400'
    };

    const stateClasses = {
      info: 'text-slate-400',
      success: 'text-emerald-400',
      error: 'text-rose-400'
    };

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        hideSidebar();
      }
    }

    function hideSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.add('hidden');
    }

    function scrollToInput() {
      hideSidebar();
      document.getElementById('message').focus();
    }

    function currentUsername() {
      return document.getElementById('username').value.trim();
    }

    function updateSortLabel() {
      sortButton.textContent = sortOrder === 'asc' ? 'Oldest ▲' : 'Newest ▼';
    }

    function toggleSortOrder() {
      sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
      updateSortLabel();
      fetchMessages();
    }

    function setStatus(message, type = 'info') {
      statusEl.textContent = message;
      statusEl.className = `text-xs ${stateClasses[type]}`;
    }

    function clearStatus() {
      setStatus('', 'info');
    }

    function scrollToBottom() {
      scrollEl.scrollTop = scrollEl.scrollHeight;
    }

    function typeBadgeClass(type) {
      return 'inline-flex items-center rounded-full px-2 py-0.5 text-[10px] font-semibold uppercase tracking-tighter border ' + (typeColors[type] || typeColors.message);
    }

    function createMessageBubble(post) {
      const isMe = post.username && post.username === currentUsername();
      const wrapper = document.createElement('div');
      wrapper.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'} gap-2`;

      const bubble = document.createElement('div');
      bubble.className = `max-w-[82%] rounded-2xl px-4 py-3 text-sm leading-relaxed shadow-sm border ${isMe ? 'bg-sky-600 text-slate-900' : 'bg-slate-800/50 text-slate-200 border-white/10'}`;

      const header = document.createElement('div');
      header.className = 'flex items-center gap-2 mb-1.5';
      const badge = document.createElement('span');
      badge.className = typeBadgeClass(post.type || 'message');
      badge.textContent = (post.type || 'message').toUpperCase();
      const from = document.createElement('span');
      from.className = `text-xs font-medium ${isMe ? 'text-slate-700' : 'text-slate-400'}`;
      from.textContent = isMe ? 'You' : (post.username || 'anonymous');
      header.append(badge, from);

      const body = document.createElement('p');
      body.className = `${isMe ? 'text-slate-900' : 'text-slate-200'}`;
      body.textContent = post.message || '';

      const time = post.timestamp ? new Date(post.timestamp * 1000).toLocaleString([], { hour: '2-digit', minute: '2-digit' }) : 'Now';
      const footer = document.createElement('div');
      footer.className = 'mt-2 flex items-center gap-1.5';
      footer.innerHTML = `<span class="text-[10px] text-slate-500/70">${time} <span class="opacity-60">• #${post.id || 'N/A'}</span></span>`;

      bubble.append(header, body, footer);
      wrapper.append(bubble);
      return wrapper;
    }

    function renderEmpty() {
      messagesEl.innerHTML = `
        <div class="flex flex-col items-center justify-center py-12 text-slate-500">
          <p class="text-sm">No messages yet. Start the conversation.</p>
        </div>`;
    }

    async function fetchMessages() {
      const filter = filterInput.value.trim();
      const url = filter ? `${endpoint}?type_filter=${encodeURIComponent(filter)}&limit=10` : `${endpoint}?limit=10`;

      messagesEl.innerHTML = '<div class="px-4 py-6 text-slate-500 text-sm">Loading messages...</div>';
      clearStatus();

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error('Failed to fetch messages');
        }
        let data = await response.json();
        messagesEl.innerHTML = '';

        if (!Array.isArray(data) || data.length === 0) {
          renderEmpty();
          return;
        }

        data = data.slice(0, 10).sort((a, b) => {
          const left = a.id ?? a.timestamp ?? 0;
          const right = b.id ?? b.timestamp ?? 0;
          return sortOrder === 'asc' ? left - right : right - left;
        });

        data.forEach(post => messagesEl.appendChild(createMessageBubble(post)));
        scrollToBottom();
      } catch (error) {
        messagesEl.innerHTML = `<div class="px-4 py-6 rounded-xl bg-rose-950/80 border border-rose-500/30 text-rose-200 text-sm">${error.message}</div>`;
      }
    }

    async function submitMessage(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const type = document.getElementById('type').value;
      const message = document.getElementById('message').value.trim();

      if (!username || !message) {
        setStatus('Username and message are required.', 'error');
        return;
      }

      submitButton.disabled = true;
      submitButton.classList.add('opacity-70', 'cursor-not-allowed');
      setStatus('Posting your message...', 'info');

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, type, message })
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || 'Unable to submit message');
        }

        setStatus('Message posted.', 'success');
        document.getElementById('message').value = '';
        document.getElementById('message').style.height = 'auto';
        await fetchMessages();
      } catch (error) {
        setStatus(error.message, 'error');
      } finally {
        submitButton.disabled = false;
        submitButton.classList.remove('opacity-70', 'cursor-not-allowed');
      }
    }

    filterToggle.addEventListener('click', () => {
      filterVisible = !filterVisible;
      filterInput.classList.toggle('hidden', !filterVisible);
      if (filterVisible) filterInput.focus();
    });

    filterInput.addEventListener('input', () => {
      filterToggle.textContent = filterInput.value.trim() || 'All types';
      clearTimeout(window.filterDebounce);
      window.filterDebounce = setTimeout(fetchMessages, 400);
    });

    const messageInput = document.getElementById('message');
    messageInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    });

    messageInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        document.getElementById('postForm').requestSubmit();
      }
    });

    document.getElementById('postForm').addEventListener('submit', submitMessage);
    document.getElementById('refreshButton').addEventListener('click', fetchMessages);
    sortButton.addEventListener('click', toggleSortOrder);
    updateSortLabel();
    document.getElementById('message').focus();
    fetchMessages();
  </script>
</body>
</html>
